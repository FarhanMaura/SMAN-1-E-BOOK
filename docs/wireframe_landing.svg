      .sketch { stroke:#222; fill:none; }
      .fill-light { fill:#f0f0f0; stroke:#444; }
      .fill-mid { fill:#d8d8d8; stroke:#555; }
      .fill-dark { fill:#333; stroke:#222; }
      .line-hint { stroke:#bbb; fill:none; }
      .dashed { stroke:#aaa; fill:none; stroke-dasharray:5,3; }
    </style>
    <!-- Rough paper texture filter -->
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- White background -->
