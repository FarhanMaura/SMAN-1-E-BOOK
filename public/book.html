<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Lengkap: Informatika Kelas X</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/book-style.css">
</head>
<body x-data="globalApp()" class="bg-pattern relative text-slate-800">


  
  <!-- Global Feedback Modal -->
  <div x-show="showFeedback" x-transition.opacity class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-md pointer-events-none">
     <div x-show="showFeedback" 
          x-transition:enter="transition ease-out duration-300"
          x-transition:enter-start="scale-75 opacity-0"
          x-transition:enter-end="scale-100 opacity-100"
          x-transition:leave="transition ease-in duration-200"
          x-transition:leave-start="scale-100 opacity-100"
          x-transition:leave-end="scale-75 opacity-0"
          class="bg-white/95 border-2 rounded-3xl p-8 text-center shadow-2xl shadow-slate-900/10 border-slate-200 max-w-md w-11/12"
          :class="isFeedbackCorrect ? 'border-teal-400 shadow-teal-500/15' : 'border-rose-400 shadow-rose-500/15'">
        
        <h3 class="text-3xl font-sora font-black mb-2" 
            :class="isFeedbackCorrect ? 'text-teal-600' : 'text-rose-600'"
            x-text="isFeedbackCorrect ? 'LUAR BIASA! 🎉' : 'COBA LAGI YUK! 😢'"></h3>
        <p class="text-slate-600 text-base font-medium" x-text="isFeedbackCorrect ? '+10 Poin ditambahkan!' : 'Baca lagi materinya pelan-pelan ya!'"></p>
     </div>
  </div>

  <!-- Global Detail Modal -->
  <div x-show="showDetailModal" x-transition.opacity class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/40 backdrop-blur-md">
     <div @click.away="showDetailModal = false" class="bg-white border border-slate-200 rounded-3xl w-[90%] max-w-[520px] max-h-[85vh] flex flex-col shadow-2xl shadow-slate-900/15">
        <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/80 rounded-t-3xl">
           <h3 class="font-bold text-slate-800 text-lg">Review Soal</h3>
           <button @click="showDetailModal = false; playClickSound()" class="w-8 h-8 rounded-full bg-slate-200/60 hover:bg-slate-200 text-slate-500 hover:text-slate-800 font-bold text-lg flex items-center justify-center transition">&times;</button>
        </div>
        <div class="p-6 overflow-y-auto">
           <template x-if="activeDetail">
              <div>
                 <p class="text-base text-slate-800 font-medium mb-6 leading-relaxed" x-html="activeDetail.q"></p>
                 <div class="space-y-3">
                    <template x-for="(opt, idx) in activeDetail.opts">
                       <button @click="jawabDariDetail(idx); playClickSound()" 
                               :class="activeDetail.dijawab ? (idx === activeDetail.ans ? 'bg-teal-50 border-teal-500 text-teal-800 font-semibold' : (idx === activeDetail.userAns ? 'bg-rose-50 border-rose-400 text-rose-800 font-semibold' : 'opacity-50 border-slate-200')) : 'bg-slate-50 hover:bg-slate-100 border-slate-200 text-slate-700'"
                               class="w-full text-left p-4 rounded-2xl border transition-all duration-200 flex gap-3 items-start shadow-sm"
                               :disabled="activeDetail.dijawab">
                          <span class="font-bold text-teal-600 mt-0.5" x-text="['A','B','C','D','E'][idx] + '.'"></span>
                          <span class="text-sm leading-snug" x-text="opt"></span>
                       </button>
                    </template>
                 </div>
              </div>
           </template>
        </div>
     </div>
  </div>

  <!-- Navigation Bar Top -->
  <div class="fixed top-4 w-full px-6 flex justify-between items-center z-40 pointer-events-none">
     <a href="/" class="pointer-events-auto text-slate-700 hover:text-teal-600 transition-all duration-200 font-bold text-sm flex items-center gap-2 bg-white/90 backdrop-blur-md px-5 py-2.5 rounded-full border border-slate-200 shadow-md hover:shadow-lg hover:border-slate-300">
       <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
       Kembali
     </a>
     
     <div class="flex gap-3 pointer-events-auto">
       <!-- Table of Contents Dropdown -->
       <div class="relative" x-data="{ openToc: false }">
          <button @click="openToc = !openToc" class="px-5 py-2.5 rounded-full bg-white/90 backdrop-blur-md border border-slate-200 hover:border-slate-300 hover:bg-slate-50 text-slate-700 text-sm font-bold transition-all shadow-md flex items-center gap-2">
             <svg class="w-4 h-4 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
             Daftar Isi
          </button>
          <div x-show="openToc" @click.away="openToc = false" x-transition class="absolute right-0 mt-3 w-72 bg-white/95 backdrop-blur-xl border border-slate-200 rounded-3xl shadow-2xl shadow-slate-900/10 overflow-hidden py-2.5 z-50">
             <button @click="goToChapter(1); openToc = false" class="w-full text-left px-5 py-3 text-sm text-slate-700 hover:bg-teal-50 hover:text-teal-700 font-medium transition border-b border-slate-100 flex items-center justify-between"><span>Bab 1: Informatika &amp; Keterampilan</span> <span class="text-xs bg-teal-100 text-teal-700 font-bold px-2 py-0.5 rounded-full">Hal 1</span></button>
             <button @click="goToChapter(2); openToc = false" class="w-full text-left px-5 py-3 text-sm text-slate-700 hover:bg-indigo-50 hover:text-indigo-700 font-medium transition border-b border-slate-100 flex items-center justify-between"><span>Bab 2: Berpikir Komputasional</span> <span class="text-xs bg-indigo-100 text-indigo-700 font-bold px-2 py-0.5 rounded-full">Bab 2</span></button>
             <button @click="goToChapter(3); openToc = false" class="w-full text-left px-5 py-3 text-sm text-slate-700 hover:bg-rose-50 hover:text-rose-700 font-medium transition border-b border-slate-100 flex items-center justify-between"><span>Bab 3: Literasi &amp; Etika AI</span> <span class="text-xs bg-rose-100 text-rose-700 font-bold px-2 py-0.5 rounded-full">Bab 3</span></button>
             <button @click="goToChapter(4); openToc = false" class="w-full text-left px-5 py-3 text-sm text-slate-700 hover:bg-amber-50 hover:text-amber-700 font-medium transition border-b border-slate-100 flex items-center justify-between"><span>Bab 4: Prompt Engineering</span> <span class="text-xs bg-amber-100 text-amber-700 font-bold px-2 py-0.5 rounded-full">Bab 4</span></button>
             <button @click="goToChapter(5); openToc = false" class="w-full text-left px-5 py-3 text-sm text-slate-700 hover:bg-sky-50 hover:text-sky-700 font-medium transition border-b border-slate-100 flex items-center justify-between"><span>Bab 5: Kreativitas Konten</span> <span class="text-xs bg-sky-100 text-sky-700 font-bold px-2 py-0.5 rounded-full">Bab 5</span></button>
             <button @click="goToChapter(6); openToc = false" class="w-full text-left px-5 py-3 text-sm text-slate-700 hover:bg-emerald-50 hover:text-emerald-700 font-medium transition flex items-center justify-between"><span>Bab 6: Pengelolaan Informasi</span> <span class="text-xs bg-emerald-100 text-emerald-700 font-bold px-2 py-0.5 rounded-full">Bab 6</span></button>
          </div>
       </div>
       
       <button id="btn-prev" class="px-5 py-2.5 rounded-full bg-white/90 backdrop-blur-md border border-slate-200 hover:border-teal-400 hover:text-teal-600 text-slate-700 text-sm font-bold transition-all shadow-md hidden md:block">← Prev</button>
       <button id="btn-next" class="px-5 py-2.5 rounded-full bg-white/90 backdrop-blur-md border border-slate-200 hover:border-indigo-400 hover:text-indigo-600 text-slate-700 text-sm font-bold transition-all shadow-md hidden md:block">Next →</button>
     </div>
  </div>

  <div class="fixed bottom-4 w-full px-6 flex justify-between items-center z-40 md:hidden pointer-events-none">
     <button id="btn-prev-mobile" class="pointer-events-auto px-6 py-3 rounded-full bg-white border border-slate-300 text-slate-800 text-sm font-bold shadow-xl">← Prev</button>
     <button id="btn-next-mobile" class="pointer-events-auto px-6 py-3 rounded-full bg-white border border-slate-300 text-slate-800 text-sm font-bold shadow-xl">Next →</button>
  </div>
  
  <!-- Animasi Luar Kiri & Kanan (Luar Kertas - Hanya di Layar Sangat Lebar & Tidak Menghalangi) -->
  <div id="animasi-luar-kiri" style="position: fixed; left: 10px; bottom: 10px; width: 220px; height: 250px; z-index: 1; pointer-events: none;" class="hidden 2xl:block opacity-80"></div>
  <div id="animasi-luar-kanan" style="position: fixed; right: 10px; bottom: 10px; width: 220px; height: 250px; z-index: 1; pointer-events: none; transform: scaleX(-1);" class="hidden 2xl:block opacity-80"></div>

  <!-- Sound Toggle Button (BGM + SFX) -->
  <button id="sound-toggle" onclick="toggleSound()" title="Toggle Musik & Suara"
    style="position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 0.5rem; padding: 0.55rem 1.4rem; border-radius: 9999px; background: rgba(255, 255, 255, 0.9); border: 1px solid #cbd5e1; color: #334155; font-size: 0.8rem; font-weight: 700; cursor: pointer; backdrop-filter: blur(12px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.08); transition: all 0.3s ease; font-family: 'Plus Jakarta Sans', sans-serif;" class="hidden xl:flex">
    <span id="sound-icon">🔔</span>
    <span id="sound-label">Musik &amp; Suara Aktif</span>
  </button>

  <script>
    // =====================================================
    // LOTTIE MANAGER - Load JSON & strip background layers
    // =====================================================
    const lottieUrls = [
      "/assets/student-anim.json",
      "https://assets3.lottiefiles.com/packages/lf20_sk5h1kfn.json",
      "https://assets5.lottiefiles.com/packages/lf20_5e7wgehs.json",
      "https://assets2.lottiefiles.com/packages/lf20_w51pcehl.json",
      "https://assets7.lottiefiles.com/packages/lf20_khzniaya.json",
      "https://assets3.lottiefiles.com/packages/lf20_rwq6ciql.json",
      "/assets/student-anim.json"
    ];

    let leftAnim = null;
    let rightAnim = null;
    const leftContainer = document.getElementById('animasi-luar-kiri');
    const rightContainer = document.getElementById('animasi-luar-kanan');

    function stripBgLayers(data) {
      if (!data || !data.layers) return data;
      data.layers = data.layers.filter(layer => layer.ty !== 1);
      return data;
    }

    async function loadLottieAnim(container, url, existingAnim) {
      try {
        const res = await fetch(url);
        if (!res.ok) return existingAnim;
        const rawData = await res.json();
        const cleanData = stripBgLayers(rawData);

        if (existingAnim) existingAnim.destroy();
        container.innerHTML = '';

        return lottie.loadAnimation({
          container: container,
          renderer: 'svg',
          loop: true,
          autoplay: true,
          animationData: cleanData
        });
      } catch (e) {
        return existingAnim;
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      leftAnim  = await loadLottieAnim(leftContainer,  lottieUrls[0], leftAnim);
      rightAnim = await loadLottieAnim(rightContainer, lottieUrls[1], rightAnim);
    });

    window.changeLottieOnFlip = async function(pageIndex) {
      const url1 = lottieUrls[pageIndex % lottieUrls.length];
      const url2 = lottieUrls[(pageIndex + 1) % lottieUrls.length];
      leftAnim  = await loadLottieAnim(leftContainer,  url1, leftAnim);
      rightAnim = await loadLottieAnim(rightContainer, url2, rightAnim);
    };

    // =====================================================
    // HIGH-FIDELITY ENHANCED BGM & SFX ENGINE
    // =====================================================
    let soundMuted = false;
    const btn   = document.getElementById('sound-toggle');
    const icon  = document.getElementById('sound-icon');
    const label = document.getElementById('sound-label');

    // --- Background Music ---
    const bgmAudio = new Audio('/assets/bgm.mp3');
    bgmAudio.loop   = true;
    bgmAudio.volume = 0.05;
    bgmAudio.preload = 'auto';

    // --- Audio Sample for Paper Flip ---
    const flipAudioSample = new Audio('/assets/flip-sound.mp3');
    flipAudioSample.volume = 1.0;
    flipAudioSample.preload = 'auto';

    // --- Ultra-Realistic Procedural Paper Flip Synthesizer ---
    let audioCtx = null;

    function initAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playPaperRustleSound() {
      if (soundMuted) return;
      initAudioContext();

      // Play real paper flip MP3
      try {
        const sfx = flipAudioSample.cloneNode();
        sfx.volume = 1.0;
        sfx.play().catch(() => {});
      } catch(e) {}

      if (!audioCtx) return;

      try {
        const now = audioCtx.currentTime;
        const duration = 0.20; // 200ms crisp paper srek duration
        const bufferSize = audioCtx.sampleRate * duration;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);

        // Generate paper fiber friction noise for realistic "SREK"
        for (let i = 0; i < bufferSize; i++) {
          const t = i / bufferSize;
          const noiseVal = Math.random() * 2 - 1;
          const env = Math.pow(Math.sin(t * Math.PI), 0.6) * (1 - t * 0.7);
          data[i] = noiseVal * env;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        // Bandpass filter for authentic paper swooshing resonance (2500Hz -> 650Hz sweep)
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(2500, now);
        filter.frequency.exponentialRampToValueAtTime(650, now + duration);
        filter.Q.setValueAtTime(1.4, now);

        // Highpass filter to eliminate boom
        const hpFilter = audioCtx.createBiquadFilter();
        hpFilter.type = 'highpass';
        hpFilter.frequency.setValueAtTime(450, now);

        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(2.0, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        noise.connect(filter);
        filter.connect(hpFilter);
        hpFilter.connect(gain);
        gain.connect(audioCtx.destination);

        noise.start(now);
      } catch(e) {}
    }

    window.playClickSound = function() {
      // Soft tactile click for UI buttons (not page flips)
      if (soundMuted) return;
      initAudioContext();
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(150, now + 0.03);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.03);
      } catch(e) {}
    };

    let bgmStarted = false;
    function tryStartBgm() {
      if (bgmStarted || soundMuted) return;
      initAudioContext();
      bgmAudio.play().then(() => { bgmStarted = true; }).catch(() => {});
    }
    document.addEventListener('click', tryStartBgm, { once: true });

    // Primary page flip sound function called on page change
    window.playFlipSound = function() {
      if (soundMuted) return;
      tryStartBgm();
      // Realistic paper flip "srek" sound
      playPaperRustleSound();
    };

    function toggleSound() {
      soundMuted = !soundMuted;
      if (soundMuted) {
        bgmAudio.pause();
        icon.textContent  = '🔕';
        label.textContent = 'Musik Mati';
        btn.style.borderColor = '#fca5a5';
        btn.style.color = '#e11d48';
      } else {
        initAudioContext();
        bgmAudio.play().catch(() => {});
        bgmStarted = true;
        icon.textContent  = '🔔';
        label.textContent = 'Musik & Suara Aktif';
        btn.style.borderColor = '#cbd5e1';
        btn.style.color = '#334155';
      }
    }
  </script>

  <div class="digitalbook-wrapper flipbook-wrapper">
     <div id="digitalbook" class="digitalbook flipbook">
        <!-- Pages dynamically injected by book-loader.js -->
     </div>
  </div>

  <script src="/assets/book-loader.js"></script>
</body>
</html>
