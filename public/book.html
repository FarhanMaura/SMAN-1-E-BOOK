<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buku Lengkap: Informatika Kelas X</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://unpkg.com/alpinejs@3/dist/cdn.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/book-style.css">
</head>
<body x-data="globalApp()" class="bg-pattern relative">

  <!-- Loading Screen -->
  <div id="loader" class="loading-overlay fixed inset-0 flex flex-col items-center justify-center transition-opacity duration-500">
     <div class="text-6xl animate-bounce mb-6 drop-shadow-[0_0_20px_rgba(45,212,191,0.5)]">📚</div>
     <h2 class="text-2xl font-sora font-bold text-transparent bg-clip-text bg-gradient-to-r from-teal-400 to-purple-400 mb-2">Menyiapkan Buku...</h2>
     <p class="text-sm text-gray-400" id="loader-text">Memuat Bab 1...</p>
     <div class="w-64 h-2 bg-gray-800 rounded-full mt-6 overflow-hidden">
        <div id="loader-bar" class="h-full bg-gradient-to-r from-teal-400 to-purple-400 w-0 transition-all duration-300"></div>
     </div>
  </div>
  
  <!-- Global Feedback Modal -->
  <div x-show="showFeedback" x-transition.opacity class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm pointer-events-none">
     <div x-show="showFeedback" 
          x-transition:enter="transition ease-out duration-300"
          x-transition:enter-start="scale-50 opacity-0"
          x-transition:enter-end="scale-100 opacity-100"
          x-transition:leave="transition ease-in duration-200"
          x-transition:leave-start="scale-100 opacity-100"
          x-transition:leave-end="scale-50 opacity-0"
          class="bg-[#1a1a2e] border-2 rounded-3xl p-8 text-center shadow-[0_0_60px_rgba(0,0,0,0.6)]"
          :class="isFeedbackCorrect ? 'border-teal-400 shadow-teal-500/20' : 'border-red-400 shadow-red-500/20'">
        
        <h3 class="text-3xl font-sora font-black mb-2" 
            :class="isFeedbackCorrect ? 'text-teal-400' : 'text-red-400'"
            x-text="isFeedbackCorrect ? 'LUAR BIASA! 🎉' : 'COBA LAGI YUK! 😢'"></h3>
        <p class="text-gray-300 text-lg" x-text="isFeedbackCorrect ? '+10 Poin ditambahkan!' : 'Baca lagi materinya pelan-pelan ya!'"></p>
     </div>
  </div>

  <!-- Global Detail Modal -->
  <div x-show="showDetailModal" x-transition.opacity class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-md">
     <div @click.away="showDetailModal = false" class="bg-[#1a1a2e] border border-gray-500/50 rounded-2xl w-[90%] max-w-[500px] max-h-[80vh] flex flex-col shadow-2xl">
        <div class="p-4 border-b border-gray-700 flex justify-between items-center bg-gray-900/40 rounded-t-2xl">
           <h3 class="font-bold text-gray-200">Review Soal</h3>
           <button @click="showDetailModal = false" class="text-gray-400 hover:text-white font-bold text-xl">&times;</button>
        </div>
        <div class="p-6 overflow-y-auto">
           <template x-if="activeDetail">
              <div>
                 <p class="text-sm text-white mb-6 leading-relaxed" x-html="activeDetail.q"></p>
                 <div class="space-y-3">
                    <template x-for="(opt, idx) in activeDetail.opts">
                       <button @click="jawabDariDetail(idx)" 
                               :class="activeDetail.dijawab ? (idx === activeDetail.ans ? 'bg-teal-600 border-teal-400 text-white' : (idx === activeDetail.userAns ? 'bg-red-600 border-red-400 text-white' : 'opacity-50 border-gray-700')) : 'bg-gray-800 hover:bg-gray-700 border-gray-600'"
                               class="w-full text-left p-4 rounded-xl border transition flex gap-3 items-start"
                               :disabled="activeDetail.dijawab">
                          <span class="font-bold text-teal-400 mt-0.5" x-text="['A','B','C','D','E'][idx] + '.'"></span>
                          <span class="text-sm text-gray-200" x-text="opt"></span>
                       </button>
                    </template>
                 </div>
              </div>
           </template>
        </div>
     </div>
  </div>

  <!-- Navigation -->
  <div class="fixed top-4 w-full px-6 flex justify-between items-center z-40 pointer-events-none">
     <a href="/" class="pointer-events-auto text-white hover:text-teal-300 transition font-semibold flex items-center gap-2 bg-black/40 backdrop-blur-md px-5 py-2.5 rounded-full border border-white/10 shadow-lg">
       <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
       Kembali
     </a>
     
     <div class="flex gap-4 pointer-events-auto">
       <!-- Table of Contents Dropdown -->
       <div class="relative" x-data="{ openToc: false }">
          <button @click="openToc = !openToc" class="px-5 py-2.5 rounded-full bg-black/40 backdrop-blur-md border border-white/10 hover:bg-white/10 text-white text-sm font-bold transition shadow-xl flex items-center gap-2">
             <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
             Daftar Isi
          </button>
          <div x-show="openToc" @click.away="openToc = false" x-transition class="absolute right-0 mt-3 w-64 bg-[#1a1a2e]/95 backdrop-blur-lg border border-gray-700 rounded-2xl shadow-2xl overflow-hidden py-2">
             <button @click="goToChapter(1); openToc = false" class="w-full text-left px-5 py-3 text-sm text-gray-300 hover:bg-white/10 hover:text-teal-400 transition border-b border-gray-700/50">Bab 1: Informatika & Keterampilan Umum</button>
             <button @click="goToChapter(2); openToc = false" class="w-full text-left px-5 py-3 text-sm text-gray-300 hover:bg-white/10 hover:text-purple-400 transition border-b border-gray-700/50">Bab 2: Berpikir Komputasional</button>
             <button @click="goToChapter(3); openToc = false" class="w-full text-left px-5 py-3 text-sm text-gray-300 hover:bg-white/10 hover:text-rose-400 transition border-b border-gray-700/50">Bab 3: Literasi & Etika AI</button>
             <button @click="goToChapter(4); openToc = false" class="w-full text-left px-5 py-3 text-sm text-gray-300 hover:bg-white/10 hover:text-teal-400 transition border-b border-gray-700/50">Bab 4: Prompt Engineering</button>
             <button @click="goToChapter(5); openToc = false" class="w-full text-left px-5 py-3 text-sm text-gray-300 hover:bg-white/10 hover:text-purple-400 transition border-b border-gray-700/50">Bab 5: Kreativitas Konten</button>
             <button @click="goToChapter(6); openToc = false" class="w-full text-left px-5 py-3 text-sm text-gray-300 hover:bg-white/10 hover:text-teal-400 transition">Bab 6: Pengelolaan Informasi</button>
          </div>
       </div>
       
       <button id="btn-prev" class="px-6 py-2.5 rounded-full bg-black/40 backdrop-blur-md border border-white/10 hover:border-teal-400 hover:text-teal-400 text-white text-sm font-bold transition shadow-xl hidden md:block">← Prev</button>
       <button id="btn-next" class="px-6 py-2.5 rounded-full bg-black/40 backdrop-blur-md border border-white/10 hover:border-purple-400 hover:text-purple-400 text-white text-sm font-bold transition shadow-xl hidden md:block">Next →</button>
     </div>
  </div>

  <div class="fixed bottom-4 w-full px-6 flex justify-between items-center z-40 md:hidden pointer-events-none">
     <button id="btn-prev-mobile" class="pointer-events-auto px-6 py-3 rounded-full bg-[#1a1a2e] border border-gray-600 text-white text-sm font-bold shadow-2xl">← Prev</button>
     <button id="btn-next-mobile" class="pointer-events-auto px-6 py-3 rounded-full bg-[#1a1a2e] border border-gray-600 text-white text-sm font-bold shadow-2xl">Next →</button>
  </div>
  
  <!-- Animasi Luar Kiri & Kanan (Luar Kertas) -->
  <div id="animasi-luar-kiri" style="position: fixed; left: 1%; bottom: 2%; width: 360px; height: 400px; z-index: 5; pointer-events: none;" class="hidden xl:block"></div>
  <div id="animasi-luar-kanan" style="position: fixed; right: 1%; bottom: 2%; width: 360px; height: 400px; z-index: 5; pointer-events: none; transform: scaleX(-1);" class="hidden xl:block"></div>


  <!-- Sound Toggle Button (BGM + SFX) -->
  <button id="sound-toggle" onclick="toggleSound()" title="Toggle Musik & Suara"
    style="position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); z-index: 50; display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1.2rem; border-radius: 999px; background: rgba(15,15,25,0.8); border: 1px solid rgba(255,255,255,0.15); color: #cbd5e1; font-size: 0.75rem; font-weight: 600; cursor: pointer; backdrop-filter: blur(10px); transition: all 0.3s ease; font-family: 'Plus Jakarta Sans', sans-serif;" class="hidden xl:flex">
    <span id="sound-icon">🔔</span>
    <span id="sound-label">Musik &amp; Suara Aktif</span>
  </button>

  <script>
    // =====================================================
    // LOTTIE MANAGER - Load JSON & strip background layers
    // =====================================================
    const lottieUrls = [
      // Study/learning themed animations (local + CDN)
      "/assets/student-anim.json",              // karakter mahasiswi belajar (local)
      "https://assets3.lottiefiles.com/packages/lf20_sk5h1kfn.json",   // karakter belajar
      "https://assets5.lottiefiles.com/packages/lf20_5e7wgehs.json",   // karakter study
      "https://assets2.lottiefiles.com/packages/lf20_w51pcehl.json",   // karakter membaca
      "https://assets7.lottiefiles.com/packages/lf20_khzniaya.json",   // karakter belajar 2
      "https://assets3.lottiefiles.com/packages/lf20_rwq6ciql.json",   // karakter study 3
      "/assets/student-anim.json"               // loop kembali ke student
    ];

    let leftAnim = null;
    let rightAnim = null;
    const leftContainer = document.getElementById('animasi-luar-kiri');
    const rightContainer = document.getElementById('animasi-luar-kanan');

    // Strip all solid-color background layers (ty===1) from lottie JSON
    function stripBgLayers(data) {
      if (!data || !data.layers) return data;
      // Remove solid fill layers (ty=1) - these are background rectangles
      data.layers = data.layers.filter(layer => layer.ty !== 1);
      return data;
    }

    async function loadLottieAnim(container, url, existingAnim) {
      try {
        const res = await fetch(url);
        if (!res.ok) return existingAnim;
        const rawData = await res.json();
        const cleanData = stripBgLayers(rawData);

        if (existingAnim) existingAnim.destroy();
        container.innerHTML = '';

        return lottie.loadAnimation({
          container: container,
          renderer: 'svg',
          loop: true,
          autoplay: true,
          animationData: cleanData
        });
      } catch (e) {
        return existingAnim;
      }
    }

    // Initial load
    document.addEventListener('DOMContentLoaded', async () => {
      leftAnim  = await loadLottieAnim(leftContainer,  lottieUrls[0], leftAnim);
      rightAnim = await loadLottieAnim(rightContainer, lottieUrls[1], rightAnim);
    });

    // Called from book-loader.js on page flip
    window.changeLottieOnFlip = async function(pageIndex) {
      const url1 = lottieUrls[pageIndex % lottieUrls.length];
      const url2 = lottieUrls[(pageIndex + 1) % lottieUrls.length];
      leftAnim  = await loadLottieAnim(leftContainer,  url1, leftAnim);
      rightAnim = await loadLottieAnim(rightContainer, url2, rightAnim);
    };

    // =====================================================
    // BGM + SFX MANAGER
    // BGM = looping background music (lofi)
    // SFX = page flip sound effect
    // =====================================================
    let soundMuted = false;
    const btn   = document.getElementById('sound-toggle');
    const icon  = document.getElementById('sound-icon');
    const label = document.getElementById('sound-label');

    // --- BGM (Background Music, looping) ---
    const bgmAudio = new Audio('/assets/bgm.mp3');
    bgmAudio.loop   = true;
    bgmAudio.volume = 0.3;
    bgmAudio.preload = 'auto';

    // --- SFX (Page Flip Sound) ---
    const flipAudio = new Audio('/assets/flip-sound.mp3');
    flipAudio.volume  = 0.6;
    flipAudio.preload = 'auto';

    // Auto-start BGM on first user interaction (required by browser policy)
    let bgmStarted = false;
    function tryStartBgm() {
      if (bgmStarted || soundMuted) return;
      bgmAudio.play().then(() => { bgmStarted = true; }).catch(() => {});
    }
    document.addEventListener('click', tryStartBgm, { once: true });

    // Called by book-loader.js on every page flip event
    window.playFlipSound = function() {
      if (soundMuted) return;
      tryStartBgm();
      flipAudio.currentTime = 0;
      flipAudio.play().catch(() => {});
    };

    function toggleSound() {
      soundMuted = !soundMuted;
      if (soundMuted) {
        bgmAudio.pause();
        icon.textContent  = '🔕';
        label.textContent = 'Musik Mati';
        btn.style.borderColor = 'rgba(239,68,68,0.5)';
        btn.style.color = '#f87171';
      } else {
        bgmAudio.play().catch(() => {});
        bgmStarted = true;
        icon.textContent  = '🔔';
        label.textContent = 'Musik & Suara Aktif';
        btn.style.borderColor = 'rgba(255,255,255,0.15)';
        btn.style.color = '#cbd5e1';
      }
    }
  </script>

  <div class="flipbook-wrapper">
     <div id="flipbook" class="flipbook">
        <!-- Pages will be injected here dynamically by book-loader.js -->
     </div>
  </div>

  <script src="/assets/book-loader.js"></script>
</body>
</html>
